[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unitccl"
version = "0.1.0"
description = "CLI + library for running, profiling, and plotting Bine-tree NCCL collective benchmarks (fastest + nsys + Slurm/submitit)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
slurm = ["submitit>=1.5"]

# NOTE: the import package is `unitccl_cli`, not `unitccl` -- the compiled
# per-project fastest/pybind11 backend extension is what's traditionally
# called `unitccl` (or another project name), and this avoids shadowing it.
[project.scripts]
unitccl = "unitccl_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
